<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Conheça o podcast Não Durma Horror e os contos de terror do projeto." />
  <meta name="author" content="Luiz / Não Durma Horror" />
  <title>Podcast | Não Durma</title>
  <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon" />
  <link rel="stylesheet" href="../nix.css" />
  <link rel="stylesheet" href="../spot.css" />
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <div class="brand">Não Durma</div>
      <nav class="main-nav" aria-label="Navegação principal">
        <a href="../index.html">Início</a>
        <a href="index2.html">Sobre</a>
        <a href="index3.html" class="active">Podcast</a>
        <a href="index4.html">YouTube</a>
        <a href="index5.html">Instagram</a>
      </nav>
    </header>

    <main class="content">
      <div class="page-header">
        <p class="eyebrow">Podcast</p>
        <h1>Histórias que deixam a noite inquieta</h1>
      </div>

      <div class="page-layout">
        <div class="page-copy">
          <p>
            Tá afim de conhecer meu trabalho? Dá uma conferida no podcast!
          </p>

          <div class="podcast-player-wrapper">
            <iframe
              id="latestEpisodePlayer"
              src="https://omny.fm/shows/n-o-durma-horror/o-vizinho-do-por-o/embed?media=audio&size=square&style=cover"
              allow="autoplay; clipboard-write; fullscreen"
              allowfullscreen
              width="400"
              height="400"
              frameborder="0"
              title="Último episódio do Não Durma Horror"
            ></iframe>
          </div>

          <div class="podcast-links">
            <a class="btn primary" href="https://pod.link/6809985396" target="_blank" rel="noreferrer">
              Ouça em todas as plataformas
            </a>
          </div>
        </div>

        <img class="page-image" src="../img/Leonardo_Diffusion_imagem_em_pixel_art_de_um_podcast_de_terror_1.jpg" alt="Arte do podcast de terror Não Durma" />
      </div>
    </main>

    <footer class="footer">
      <p>© 2026 Não Durma Horror</p>
    </footer>
  </div>

  <script>
    const latestEpisodePlayer = document.getElementById('latestEpisodePlayer');
    const podcastRssUrl = 'https://omny.fm/shows/n-o-durma-horror/playlists/podcast.rss';

    async function loadLatestEpisode() {
      try {
        const response = await fetch(`${podcastRssUrl}?t=${Date.now()}`);
        if (!response.ok) throw new Error(`RSS falhou com status ${response.status}`);

        const rssText = await response.text();
        const rssDocument = new DOMParser().parseFromString(rssText, 'application/xml');
        const firstEpisode = rssDocument.querySelector('item');
        const episodeLink = firstEpisode?.querySelector('link')?.textContent?.trim();
        const episodeTitle = firstEpisode?.querySelector('title')?.textContent?.trim();

        if (!episodeLink) throw new Error('Nenhum episódio encontrado no RSS');

        latestEpisodePlayer.src = `${episodeLink.replace(/\/$/, '')}/embed?media=audio&size=square&style=cover`;
        latestEpisodePlayer.title = episodeTitle || 'Último episódio do Não Durma Horror';
      } catch (error) {
        console.error('Não foi possível carregar o último episódio:', error);
      }
    }

    loadLatestEpisode();
  </script>
</body>
</html>
